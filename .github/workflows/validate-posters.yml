name: Validate Cleo Days posters
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate restaurant programme and map scripts
        run: |
          node --check restaurant-program.js
          node --check resort-data.js
          node --check resort.js
          node --check sw.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert 'restaurant-program.js' in html
          assert 'restaurant-program.css' in html
          assert 'Arabian Night' in html
          assert 'restaurant-program.js' in Path('sw.js').read_text()
          assert 'function weekMatrix()' in Path('restaurant-program.js').read_text()
          print('Restaurant schedule and offline assets validated')
          PY
      - name: Validate all HTML scripts, event mapping and offline cache
        run: |
          python3 - <<'PY'
          import json, re, subprocess, pathlib, tempfile
          root=pathlib.Path('.')
          for name in ['index.html','posters.html','event.html']:
              text=(root/name).read_text(encoding='utf-8')
              scripts=re.findall(r'(<script\b[^>]*>)(.*?)</script>',text,re.S|re.I)
              assert scripts, f'no script in {name}'
              for n,(tag,script) in enumerate(scripts):
                  if 'type="application/json"' in tag:
                      json.loads(script)
                      continue
                  if not script.strip(): continue
                  p=pathlib.Path(tempfile.gettempdir())/f'{name}-{n}.js'
                  p.write_text(script,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
              print('VALID',name,'scripts',len(scripts))
          subprocess.run(['node','--check','native.js'],check=True)
          html=(root/'index.html').read_text()
          posters=(root/'posters.html').read_text()
          data=json.loads(re.search(r'<script id="cleoData" type="application/json">(.*?)</script>',html,re.S).group(1))
          info=json.loads(re.search(r'<script id="poster-data" type="application/json">(.*?)</script>',posters,re.S).group(1))
          assert len(data['events']) > 200
          assert len(info['posters']) == 24 and len(info['games']) == 18
          assert 'data-event-detail' in html and 'eventPosterDialog' in html
          assert 'event.html' in (root/'sw.js').read_text()
          print('VERIFIED',len(data['events']),'events,',len(info['posters']),'posters,',len(info['games']),'guides')
          PY
